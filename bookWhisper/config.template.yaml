# bookWhisper 配置文件模板
# 复制到家目录并修改：
#   cp config.template.yaml ~/.bookwhisper.yaml
#
# 程序启动会自动加载 ~/.bookwhisper.yaml（如果存在）。
# 也可以通过 --config 指定其他路径。

deepseek:
  # API Key，支持环境变量 ${DEEPSEEK_API_KEY}
  api_key: "${DEEPSEEK_API_KEY}"
  # 默认使用 flash（性价比高）；需要更高解读质量可改为 deepseek-v4-pro
  model: "deepseek-v4-flash"
  base_url: "https://api.deepseek.com"
  temperature: 0.3
  max_tokens: 65536              # 单次 API 调用最大输出 token 数（需覆盖思考链 + 正文）

chunk:
  max_chars: 15000               # 单块最大中文字符数（足够大才能去啰嗦；novel 模式自动减半）
  book_summary_chars: 800         # 整书摘要最大字数

output:
  dir: "./output"                # 输出目录
  suffix: "_interpreted"         # 输出文件名后缀

# 解读模式："default" 为默认的社会科学书籍通俗化解读，"novel" 为小说翻译优化
mode: "default"

# 空内容回退：API 多次返回空内容后是否回退到原文（默认 false）
fallback_to_original_on_empty: false

# 并行解读 worker 数量（默认 5）
parallel_workers: 5

# 批量翻译时同时处理的书籍数量（默认 20）
batch_workers: 20
